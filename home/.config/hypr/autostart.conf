# Extra autostart processes
# exec-once = [workspace 1 slient] uwsm app -- my-service
exec-once = [workspace 1 silent] uwsm-app -- google-chrome-stable
exec-once = [workspace 2 silent] uwsm-app -- code
exec-once = [workspace 3 silent] uwsm-app -- xdg-terminal-exec
exec-once = [workspace 4 silent] uwsm-app -- nautilus --new-window "$HOME/Downloads"
exec-once = [workspace 4 silent] uwsm-app -- nautilus --new-window "$HOME/github"
