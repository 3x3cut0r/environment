# yazi keymaps
# Docs: https://yazi-rs.github.io/docs/configuration/keymap
#
# prepend_keymap entries take priority over the built-in defaults.

[mgr]
prepend_keymap = [
    { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here" },
    { on = [ "g", "h" ], run = "cd ~", desc = "Go to home directory" },
    { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to downloads" },
    { on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to config directory" },
    { on = [ "g", "r" ], run = "cd /", desc = "Go to filesystem root" },
    { on = [ "g", "e" ], run = "cd ~/.config/nvim", desc = "Go to Neovim config" },
]
