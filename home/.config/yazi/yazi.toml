# yazi configuration
# Docs: https://yazi-rs.github.io/docs/configuration/yazi
#
# Most defaults are kept intentionally. Theme and keymaps live in
# theme.toml and keymap.toml next to this file.

# Show Git status in the file list (git.yazi).
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
