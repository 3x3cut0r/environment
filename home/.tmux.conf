### GENERAL ###

# Set the default TERM value for all tmux panes to "tmux-256color"
set -g default-terminal "tmux-256color"

# Keep an extended scrollback history for long-running sessions.
set -g history-limit 50000

# Sync the tmux clipboard with the system clipboard when possible.
set -g set-clipboard on

# Automatically rename windows based on the active command.
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# Copy selections to the appropriate system clipboard tool depending on the OS.
# MacOS
if-shell 'test "$(uname)" = "Darwin"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip"'

# Linux
if-shell 'uname | grep -q Linux' {
  bind -n WheelDownPane select-pane -t= \; send-keys -M
  bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

# Disable mouse interactions for pane selection, resizing, and scrolling.
set -g mouse off
setw -g mouse off

### BIND-KEYS ###

# Keep Ctrl+b as the primary tmux prefix and make Ctrl+s optionally available.
set -g prefix C-b
set -g prefix2 C-s

# Use vi-style key bindings inside copy mode.
setw -g mode-keys vi

# Control mouse support
# Set Prefix + m to enable mouse support
bind-key m \
    set -g mouse on \;\
    setw -g mouse on

# Set Prefix + M to disable mouse support
bind-key M \
    set -g mouse off \;\
    setw -g mouse off

# Reload the configuration with Prefix + r instead of the default binding.
unbind r
bind-key r source-file ~/.tmux.conf

# Provide quick shortcuts for horizontal and vertical splits.
bind-key | split-window -h
bind-key - split-window -v

# Navigate between panes with vim-style bindings.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

### PLUGINS ###

# Load the tmux plugin manager and its plugin list.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Activate continuum-restore to restore last saved environment automatically when tmux is started.
set -g @continuum-restore 'on'

# Activate the catppuccin plugin (https://github.com/omerxx/catppuccin-tmux)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @plugin 'catppuccin/tmux'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize the plugin manager (keep this line at the bottom of tmux.conf).
run '~/.tmux/plugins/tpm/tpm'
